[package]
name = "draw-compute"
version = "0.1.0"
edition = "2021"

[dependencies]
bytemuck = { version = "1.22", features = ["derive"] }
eframe = { version = "0.31", features = ["wgpu"] }
egui = "0.31"
egui-wgpu = "0.31"
glam = { version = "0.30", default-features = false, features = ["bytemuck", "libm"] }
wgpu = { version = "24.0", features = ["spirv"] }

shader = { path = "shader" }
